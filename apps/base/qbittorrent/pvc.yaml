apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-media
spec:
  capacity:
    storage: 393Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: qbittorrent
    name: media
  hostPath:
    path: /mnt/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 393Gi
  volumeName: qbittorrent-media
  storageClassName: ""