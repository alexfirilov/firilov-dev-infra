apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/gabe565/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qbittorrent
  namespace: flux-system
spec:
  releaseName: qbittorrent
  targetNamespace: qbittorrent
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: qbittorrent
      sourceRef:
        kind: HelmRepository
        name: qbittorrent
        namespace: flux-system
  values:
    image:
      tag: 5.1.4
    env:
      TZ: Asia/Jerusalem
      # Run as the shared media user so Sonarr/Radarr can hardlink downloads
      # into the library (kernel fs.protected_hardlinks requires write access).
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
    persistence:
      config:
        enabled: true
        retain: true
        accessMode: ReadWriteOnce
        size: 1Gi

      media:
        enabled: true
        existingClaim: media
        mountPath: /mnt/media
