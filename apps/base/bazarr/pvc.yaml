apiVersion: v1
kind: PersistentVolume
metadata:
  name: bazarr-media
spec:
  capacity:
    storage: 393Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: bazarr
    name: media
  hostPath:
    path: /mnt/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: bazarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 393Gi
  volumeName: bazarr-media
  storageClassName: ""
