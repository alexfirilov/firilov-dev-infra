apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
  namespace: flux-system
spec:
  releaseName: bazarr
  targetNamespace: bazarr
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.x
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      bazarr:
        containers:
          app:
            image:
              repository: lscr.io/linuxserver/bazarr
              tag: latest
            env:
              TZ: Asia/Jerusalem
              PUID: "1000"
              PGID: "1000"
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    service:
      app:
        controller: bazarr
        ports:
          http:
            port: 6767
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /config
      media:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
          - path: /mnt/media
