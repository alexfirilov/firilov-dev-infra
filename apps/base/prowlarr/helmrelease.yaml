apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prowlarr
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.pree.dev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
  namespace: flux-system
spec:
  releaseName: prowlarr
  targetNamespace: prowlarr
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: prowlarr
      sourceRef:
        kind: HelmRepository
        name: prowlarr
        namespace: flux-system
  values:
    env:
      TZ: Asia/Jerusalem
    persistence:
      config:
        enabled: true
        retain: true
        accessMode: ReadWriteOnce
        size: 1Gi
