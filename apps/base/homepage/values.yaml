env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: firilov.dev
  - name: TZ
    value: Asia/Jerusalem

config:
  settings:
    title: Firilov Dev
    background: 
        image: https://w.wallhaven.cc/full/4v/wallhaven-4vw5v8.jpg
        blur: sm
        saturate: 50
        brightness: 50
        opacity: 80
    useEqualHeights: true
    headerStyle: clean
    quicklaunch:
        hideInternetSearch: true
        showSearchSuggestions: false
        hideVisitURL: true
        provider: google
    hideVersion: true
    layout:
      - Media Servers:
          style: row
          columns: 4
      - Media Management:
          style: row
          columns: 5
      - Infrastructure & Ops:
          style: row
          columns: 1
      - Automation & Tools:
          style: row
          columns: 1
      - Development:
          style: row
          columns: 1

  services:
    - Media Servers:
        - Jellyfin:
            icon: jellyfin
            href: https://jellyfin.firilov.dev
            description: Media Server
        - Plex:
            icon: plex
            href: https://plex.firilov.dev
            description: Media Server
        - Jellyseerr:
            icon: jellyseerr
            href: https://jellyseerr.firilov.dev
            description: Media Requests
        - Audiobookshelf:
            icon: audiobookshelf
            href: https://audiobookshelf.firilov.dev
            description: Audibooks Server
            
    - Media Management:
        - qBittorrent:
            icon: qbittorrent
            href: https://qbittorrent.firilov.dev
        - Radarr:
            icon: radarr
            href: https://radarr.firilov.dev
        - Sonarr:
            icon: sonarr
            href: https://sonarr.firilov.dev
        - Prowlarr:
            icon: prowlarr
            href: https://prowlarr.firilov.dev
        - Bazarr:
            icon: bazarr
            href: https://bazarr.firilov.dev

    - Infrastructure & Ops:
        - Coroot:
            icon: coroot
            href: https://monitor.firilov.dev
            description: Observability
            
    - Automation & Tools:
        - n8n:
            icon: n8n
            href: https://n8n.firilov.dev

  bookmarks:
    - Development:
        - GitHub:
            - icon: github
              href: https://github.com/AlexFirilov?tab=repositories