apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
  namespace: flux-system
spec:
  releaseName: recyclarr
  targetNamespace: recyclarr
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.x
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      recyclarr:
        type: cronjob
        cronjob:
          schedule: "0 2 * * *"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 3
          failedJobsHistory: 3
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: "8"
            args:
              - sync
            env:
              TZ: Asia/Jerusalem
            envFrom:
              - secretRef:
                  name: recyclarr-secret
    persistence:
      config:
        enabled: true
        type: configMap
        name: recyclarr-config
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
            readOnly: true
