# The assistant: Claude Code (owner's subscription) in tmux with the Telegram channel.
# Its whole home (Claude login, plugins, memory, workspace) is on the PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-home
  namespace: assistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: assistant
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # One session per Telegram bot token (two pollers would fight over updates).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s2
      containers:
        - name: agent
          image: ghcr.io/alexfirilov/home-agent:sha-1ad9fec
          env:
            - name: TZ
              value: Asia/Jerusalem
            - name: AGENT_BROWSER_URL
              value: https://agent-browser.TAILNET.ts.net
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: { name: assistant-secrets, key: TELEGRAM_BOT_TOKEN }
            - name: WAHA_MCP_KEY
              valueFrom:
                secretKeyRef: { name: assistant-secrets, key: WAHA_MCP_KEY }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: home
              mountPath: /home/agent
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 3Gi }
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: agent-home
