# Real (headful) Chromium the owner can watch/take over through Tailscale, plus a
# Playwright MCP sidecar that drives it over CDP on localhost:9222 (Chromium binds
# CDP to loopback only, so the sidecar is the only way in).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: browser-config
  namespace: assistant
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: browser-init
  namespace: assistant
data:
  10-clear-profile-locks.sh: |
    #!/usr/bin/with-contenv bash
    # A pod restart leaves stale Chromium singleton locks on the persistent profile.
    rm -f /config/agent-profile/Singleton* 2>/dev/null || true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: browser
  namespace: assistant
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # One Chromium per persistent profile.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: browser
  template:
    metadata:
      labels:
        app.kubernetes.io/name: browser
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s2
      containers:
        - name: chromium
          image: lscr.io/linuxserver/chromium:f1bb645d-ls62
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Asia/Jerusalem
            - name: TITLE
              value: Assistant browser
            - name: CHROME_CLI
              value: >-
                --user-data-dir=/config/agent-profile
                --remote-debugging-port=9222
                --no-first-run
                --no-default-browser-check
            # Single-app lockdown: watchdog relaunches Chromium if closed, no
            # close button, no terminal/sudo in the web UI.
            - name: HARDEN_OPENBOX
              value: "true"
            - name: HARDEN_DESKTOP
              value: "true"
            - name: SELKIES_MANUAL_WIDTH
              value: "1366"
            - name: SELKIES_MANUAL_HEIGHT
              value: "900"
            - name: CUSTOM_USER
              valueFrom:
                secretKeyRef: { name: assistant-secrets, key: BROWSER_USER }
            - name: PASSWORD
              valueFrom:
                secretKeyRef: { name: assistant-secrets, key: BROWSER_PASSWORD }
          volumeMounts:
            - name: config
              mountPath: /config
            - name: dshm
              mountPath: /dev/shm
            - name: init
              mountPath: /custom-cont-init.d
              readOnly: true
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 2560Mi }
        - name: playwright-mcp
          image: mcr.microsoft.com/playwright/mcp:v0.0.83
          command: ["/usr/bin/tini", "-s", "--", "node", "/app/cli.js"]
          args:
            - --cdp-endpoint=http://127.0.0.1:9222
            - --host=0.0.0.0
            - --port=8931
            - --allowed-hosts=*
            - --shared-browser-context
            - --output-dir=/tmp/playwright-output
            - --timeout-action=15000
            - --timeout-navigation=90000
          ports:
            - name: mcp
              containerPort: 8931
          readinessProbe:
            tcpSocket: { port: mcp }
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: browser-config
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: init
          configMap:
            name: browser-init
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: browser
  namespace: assistant
spec:
  selector:
    app.kubernetes.io/name: browser
  ports:
    - name: mcp
      port: 8931
      targetPort: mcp
    - name: http
      port: 3000
      targetPort: http
