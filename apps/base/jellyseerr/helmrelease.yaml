apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyseerr
  namespace: flux-system
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/seerr-team/seerr
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
  namespace: flux-system
spec:
  releaseName: jellyseerr
  targetNamespace: jellyseerr
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: seerr-chart
      sourceRef:
        kind: HelmRepository
        name: jellyseerr
        namespace: flux-system
  values:
    extraEnv:
      - name: TZ
        value: Asia/Jerusalem
    config:
      persistence:
        annotations:
          helm.sh/resource-policy: keep
        accessModes:
          - ReadWriteOnce
        size: 5Gi
