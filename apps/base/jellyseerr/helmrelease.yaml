apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyseerr
  namespace: flux-system
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/seerr-team/seerr
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
  namespace: flux-system
spec:
  releaseName: jellyseerr
  targetNamespace: jellyseerr
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: seerr-chart
      sourceRef:
        kind: HelmRepository
        name: jellyseerr
        namespace: flux-system
  values:
    # Homelab stream-first fork of Seerr. Rebasing onto a new upstream release
    # means retagging this image, not editing the chart.
    image:
      registry: ghcr.io
      repository: alexfirilov/seerr-stream-first
      tag: stream-first-c9cd974
    imagePullSecrets:
      - name: ghcr-pull
    extraEnv:
      - name: TZ
        value: Asia/Jerusalem
    # The broker URL and API key are read together; supplying only one makes
    # Seerr fail closed. Both live in the seerr-stream-first secret.
    extraEnvFrom:
      - secretRef:
          name: seerr-stream-first
          optional: true
    config:
      persistence:
        annotations:
          helm.sh/resource-policy: keep
        accessModes:
          - ReadWriteOnce
        size: 5Gi
