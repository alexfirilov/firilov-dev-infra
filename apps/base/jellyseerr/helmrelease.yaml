apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyseerr
  namespace: flux-system
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/seerr-team/seerr
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyseerr
  namespace: flux-system
spec:
  releaseName: jellyseerr
  targetNamespace: jellyseerr
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: seerr-chart
      sourceRef:
        kind: HelmRepository
        name: jellyseerr
        namespace: flux-system
  values:
    env:
      TZ: Asia/Jerusalem
    persistence:
      config:
        enabled: true
        retain: true
        accessMode: ReadWriteOnce
        size: 5Gi
