apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drop
  namespace: drop
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - drop.firilov.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Large downloads can stream for a long time.
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: drop
          port: 8080
