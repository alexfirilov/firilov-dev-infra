apiVersion: apps/v1
kind: Deployment
metadata:
  name: drop
  namespace: drop
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # SQLite and local-path storage require one writer at a time.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: drop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drop
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s2
      containers:
        - name: drop
          image: ghcr.io/alexfirilov/drop:sha-6e947f0
          imagePullPolicy: IfNotPresent
          env:
            - name: TZ
              value: UTC
            - name: DROP_DATA_DIR
              value: /data
            - name: DROP_BASE_URL
              value: https://drop.firilov.dev
            - name: DROP_DIRECT_URL
              # Envoy Gateway on the LAN; bypasses Cloudflare's 100 MB request limit (shown in the API docs).
              value: http://10.100.102.54
            - name: DROP_ADMIN_USER
              value: alexf
            - name: DROP_SECRET_FILE
              value: /var/run/secrets/drop/secret
            - name: DROP_ADMIN_PASSWORD_FILE
              value: /var/run/secrets/drop/admin-password
            - name: DROP_MAX_FILE_SIZE
              value: 30GiB
            - name: DROP_TRUSTED_PROXIES
              # Envoy connects directly from the cluster pod network.
              value: 10.42.0.0/16
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: secrets
              mountPath: /var/run/secrets/drop
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: drop
        - name: secrets
          secret:
            secretName: drop-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
