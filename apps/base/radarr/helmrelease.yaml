apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: radarr
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.pree.dev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: flux-system
spec:
  releaseName: radarr
  targetNamespace: radarr
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: radarr
      sourceRef:
        kind: HelmRepository
        name: radarr
        namespace: flux-system
  values:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - k3s2
    tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
    env:
      TZ: Asia/Jerusalem
    # Match qBittorrent's uid/gid so imports hardlink instead of copy.
    podSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    persistence:
      config:
        enabled: true
        retain: true
        accessMode: ReadWriteOnce
        size: 1Gi

      media:
        enabled: true
        existingClaim: media
        mountPath: /mnt/media
