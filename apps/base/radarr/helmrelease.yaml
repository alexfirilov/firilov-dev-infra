apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: radarr
  namespace: flux-system
spec:
  interval: 24h
  url: https://charts.pree.dev
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: flux-system
spec:
  releaseName: radarr
  targetNamespace: radarr
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: radarr
      sourceRef:
        kind: HelmRepository
        name: radarr
        namespace: flux-system
  values:
    env:
      TZ: Asia/Jerusalem
    persistence:
      config:
        enabled: true
        retain: true
        accessMode: ReadWriteOnce
        size: 1Gi

      media:
        enabled: true
        existingClaim: media
        mountPath: /mnt/media
