apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: plex
  namespace: flux-system
spec:
  interval: 24h
  url: https://k8s-home-lab.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: flux-system
spec:
  releaseName: plex
  targetNamespace: plex
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: plex
      sourceRef:
        kind: HelmRepository
        name: plex
        namespace: flux-system
  values:
    image:
      repository: lscr.io/linuxserver/plex
      tag: 1.43.0
    env:
      TZ: Asia/Jerusalem
      PUID: "1000"
      PGID: "1000"
      VERSION: docker
    persistence:
      config:
        enabled: true
        retain: true
        size: 1Gi
        accessMode: ReadWriteOnce
        mountPath: /config

      transcode:
        enabled: true
        accessMode: ReadWriteOnce
        size: 1Gi
        mountPath: /transcode

      media:
        enabled: true
        existingClaim: media
        mountPath: /mnt/media
