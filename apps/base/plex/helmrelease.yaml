apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: flux-system
spec:
  releaseName: plex
  targetNamespace: plex
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.x
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s2
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 60
    controllers:
      plex:
        containers:
          app:
            securityContext:
              privileged: true
            image:
              repository: lscr.io/linuxserver/plex
              tag: latest
            env:
              TZ: Asia/Jerusalem
              PUID: "1000"
              PGID: "1000"
              VERSION: docker
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    service:
      app:
        controller: plex
        ports:
          http:
            port: 32400
    persistence:
      transcode:
        type: emptyDir
        medium: Memory
        sizeLimit: 8Gi
        globalMounts:
          - path: /transcode
      config:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: plex-config
        globalMounts:
          - path: /config
      media:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
          - path: /mnt/media
      dri:
        enabled: true
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - path: /dev/dri
