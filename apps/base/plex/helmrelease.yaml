apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: plex
  namespace: flux-system
spec:
  releaseName: plex
  targetNamespace: plex
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 4.x
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    defaultPodOptions:
      nodeSelector:
        kubernetes.io/hostname: k3s2
    controllers:
      plex:
        containers:
          app:
            securityContext:
              privileged: true
            image:
              repository: lscr.io/linuxserver/plex
              tag: latest
            env:
              TZ: Asia/Jerusalem
              PUID: "1000"
              PGID: "1000"
              VERSION: docker
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
    service:
      app:
        controller: plex
        ports:
          http:
            port: 32400
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /config
      media:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: media
        globalMounts:
          - path: /mnt/media
      dri:
        enabled: true
        type: hostPath
        hostPath: /dev/dri
        globalMounts:
          - path: /dev/dri
