apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  interval: 24h
  url: https://jellyfin.github.io/jellyfin-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: flux-system
spec:
  releaseName: jellyfin
  targetNamespace: jellyfin
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: jellyfin
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: flux-system
  values:
    jellyfin:
      env:
        - name: TZ
          value: "Asia/Jerusalem"
    persistence:
      config:
        enabled: true
        size: 5Gi
        accessMode: ReadWriteOnce
      media:
        enabled: true
        type: pvc
        existingClaim: media
    volumes:
      - name: dri
        hostPath:
          path: /dev/dri
    volumeMounts:
      - name: dri
        mountPath: /dev/dri
