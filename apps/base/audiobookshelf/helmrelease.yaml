apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: audiobookshelf
  namespace: flux-system
spec:
  interval: 24h
  url: https://k8s-home-lab.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
  namespace: flux-system
spec:
  releaseName: audiobookshelf
  targetNamespace: audiobookshelf
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: audiobookshelf
      sourceRef:
        kind: HelmRepository
        name: audiobookshelf
        namespace: flux-system
  values:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - k3s2
    tolerations:
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
    env:
      TZ: Asia/Jerusalem
    persistence:
      config:
        enabled: true
        size: 1Gi
        accessMode: ReadWriteOnce
      metadata:
        enabled: true
        size: 1Gi
        accessMode: ReadWriteOnce
      media:
        enabled: true
        size: 1Gi
        accessMode: ReadWriteOnce
