apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-twofold
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: twofold
  sourceRef:
    kind: GitRepository
    name: twofold 
  path: "./k8s"
  prune: true
  dependsOn:
    - name: infrastructure-namespaces
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: twofold
  namespace: flux-system
spec:
  image: ghcr.io/alexfirilov/twofold
  interval: 5m
  secretRef:
    name: ghcr-secret
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: twofold
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: twofold
  policy:
    numerical:
      order: asc
  filterTags:
    pattern: '^[0-9]+$'
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: twofold
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: twofold
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: '{{range .Changed.Objects}}{{println .}}{{end}}'
    push:
      branch: main
  update:
    path: "./k8s"
    strategy: Setters