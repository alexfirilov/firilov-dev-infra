apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: audiobookshelf
  namespace: flux-system
spec:
  interval: 24h
  url: https://k8s-home-lab.github.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
  namespace: flux-system
spec:
  releaseName: audiobookshelf
  targetNamespace: audiobookshelf
  install:
    createNamespace: true
  interval: 30m
  chart:
    spec:
      chart: audiobookshelf
      sourceRef:
        kind: HelmRepository
        name: audiobookshelf
        namespace: flux-system
  values:
    env:
      TZ: Asia/Jerusalem
    persistence:
      config:
        enabled: true
        size: 1Gi
        accessMode: ReadWriteOnce
      metadata:
        enabled: true
        size: 1Gi
        accessMode: ReadWriteOnce
      media:
        enabled: true
        size: 1Gi
        accessMode: ReadWriteOnce
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway-system
  hostnames:
    - "audiobookshelf.firilov.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: audiobookshelf
          port: 80