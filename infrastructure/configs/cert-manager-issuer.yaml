apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: alex@firilov.dev
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-firilov-dev
  namespace: envoy-gateway-system
spec:
  secretName: jellyfin-firilov-dev-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - jellyfin.firilov.dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radarr-firilov-dev
  namespace: envoy-gateway-system
spec:
  secretName: radarr-firilov-dev-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - radarr.firilov.dev
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyseerr-firilov-dev
  namespace: envoy-gateway-system
spec:
  secretName: jellyseerr-firilov-dev-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - jellyseerr.firilov.dev
