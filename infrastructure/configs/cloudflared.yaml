apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: envoy-gateway-system
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          # Pin the tested release for reproducible transport behavior.
          image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            # HTTP/2 avoids repeated QUIC failures and poor upload throughput here.
            - name: TUNNEL_TRANSPORT_PROTOCOL
              value: http2
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tunnel-credentials
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 100Mi
