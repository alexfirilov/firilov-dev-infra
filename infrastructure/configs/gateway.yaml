apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https-byparr
      protocol: HTTPS
      port: 443
      hostname: byparr.firilov.dev
      tls:
        mode: Terminate
        certificateRefs:
          - name: byparr-firilov-dev-tls
            namespace: envoy-gateway-system
      allowedRoutes:
        namespaces:
          from: All
    - name: https-radarr
      protocol: HTTPS
      port: 443
      hostname: radarr.firilov.dev
      tls:
        mode: Terminate
        certificateRefs:
          - name: radarr-firilov-dev-tls
            namespace: envoy-gateway-system
      allowedRoutes:
        namespaces:
          from: All
    - name: https-jellyseerr
      protocol: HTTPS
      port: 443
      hostname: jellyseerr.firilov.dev
      tls:
        mode: Terminate
        certificateRefs:
          - name: jellyseerr-firilov-dev-tls
            namespace: envoy-gateway-system
      allowedRoutes:
        namespaces:
          from: All
    - name: https-prowlarr
      protocol: HTTPS
      port: 443
      hostname: prowlarr.firilov.dev
      tls:
        mode: Terminate
        certificateRefs:
          - name: prowlarr-firilov-dev-tls
            namespace: envoy-gateway-system
      allowedRoutes:
        namespaces:
          from: All
